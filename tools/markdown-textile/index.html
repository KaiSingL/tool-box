  <main id="main" class="main">
    <div class="tool-container">
      <div class="tool-hero">
        <h1 class="section-title">Markdown ⇄ Textile</h1>
        <p class="section-subtitle">Convert between Markdown and Redmine Textile markup. Type in the box, then convert in either direction.</p>
      </div>

      <div class="tool-form">
        <div class="form-group">
          <div class="form-group__header">
            <label for="input" class="label-brutal">Markup</label>
            <div class="converter-actions" id="converter-actions">
              <button id="to-textile" class="btn-primary" type="button">
                <svg class="icon-arrow-right" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
                <span>To Textile</span>
              </button>

              <button id="copy-btn" class="btn-secondary" type="button">Copy</button>

              <button id="to-markdown" class="btn-primary" type="button">
                <span>To Markdown</span>
                <svg class="icon-arrow-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
              </button>
            </div>
          </div>

          <textarea
            id="input"
            class="input-brutal converter-input"
            rows="3"
            spellcheck="false"
            placeholder="Paste Markdown or Redmine Textile here..."
          ></textarea>
        </div>

        <div id="error" class="error-message hidden" role="alert"></div>
      </div>
    </div>
  </main>
